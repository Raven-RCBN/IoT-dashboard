<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IoT Tracker Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel">
        <form id="loginForm" class="login-form">
          <label>
            <span>User Name</span>
            <input
              id="loginUsername"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="User Name"
            />
          </label>

          <label>
            <span>Password</span>
            <span class="password-control">
              <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Password"
                autofocus
              />
              <button id="togglePassword" type="button" class="password-toggle">Show</button>
            </span>
          </label>

          <button type="submit" class="primary-button login-button">Login</button>
        </form>
        <p id="loginMessage" class="login-message">Sign in to open the display page.</p>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
