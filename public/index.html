<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IoT Tracker Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel">
        <form id="loginForm" class="login-form">
          <label>
            <span>Username</span>
            <input
              id="loginUsername"
              name="username"
              type="text"
              autocomplete="username"
              value="User"
            />
          </label>

          <label>
            <span>Password</span>
            <input
              id="loginPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              autofocus
            />
          </label>

          <button type="submit" class="primary-button">Sign in</button>
        </form>
        <p id="loginMessage" class="login-message">Sign in to open the display page.</p>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
