services:
  iot-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - iot-mongo-data:/data/db
    ports:
      - "127.0.0.1:27029:27017"

  iot-api:
    build: .
    restart: unless-stopped
    depends_on:
      - iot-mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://iot-mongo:27017/iot_tracker
      COUNT_NEXT_UPLOAD_SECONDS: 3600
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      DASHBOARD_PUBLIC: ${DASHBOARD_PUBLIC:-true}
      DASHBOARD_PUBLIC_HOSTS: ${DASHBOARD_PUBLIC_HOSTS:-localhost,127.0.0.1}
      DASHBOARD_USER: ${DASHBOARD_USER:-User}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-User@123}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-local-dashboard-session-secret}
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  iot-mongo-data:
